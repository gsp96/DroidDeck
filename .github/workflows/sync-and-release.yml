name: Auto Sync Upstream & Release APK

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간 새벽 3시(UTC 18:00) 자동 실행
  workflow_dispatch:     # 웹에서 Run workflow 버튼으로 즉시 실행

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-and-release
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: Droid-Deck/DroidDeck
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-and-release:
    name: Build & Publish Release APK
    needs: sync
    if: always() && (needs.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Cargo NDK & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ninja-build
          cargo install cargo-ndk --locked

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK with Test Key
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
          "$TOOLS/apksigner" sign \
            --ks keystore/testkey.p12 --ks-type PKCS12 --ks-pass pass:android \
            --ks-key-alias testkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned" "$APK.idsig"
          echo "SIGNED_APK=$APK" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-automated"
          SHORT_SHA=$(git rev-parse --short HEAD)
          TITLE="DroidDeck Automated Build ($SHORT_SHA)"
          BODY="Upstream Sync & Automated Build from commit $GITHUB_SHA.
          
          - Built at: $(date -u)
          - Source Commit: https://github.com/Droid-Deck/DroidDeck/commit/$GITHUB_SHA"

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$SIGNED_APK" \
            --title "$TITLE" \
            --notes "$BODY" \
            --prerelease=false
